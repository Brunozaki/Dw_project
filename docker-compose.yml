# Baseado no docker-compose.yaml oficial do Airflow 3.3.2, com LocalExecutor no
# lugar de Celery/Redis e um Postgres separado para o data warehouse.
x-airflow-common: &airflow-common
  image: apache/airflow:3.3.2
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:?}:${AIRFLOW_DB_PASSWORD:?}@postgres-airflow/${AIRFLOW_DB_NAME:?}
    AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY:?}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DEFAULT_TIMEZONE: America/Sao_Paulo
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    AIRFLOW_CONN_DW_POSTGRES: postgresql://${DW_USER:?}:${DW_PASSWORD:?}@postgres-dw:5432/${DW_DB:?}
  volumes:
    - ./dags:/opt/airflow/dags:ro
    # Volume nomeado: chown em bind mount de /mnt/d costuma falhar no WSL.
    - airflow-logs:/opt/airflow/logs
  depends_on: &airflow-common-depends-on
    postgres-airflow:
      condition: service_healthy
    postgres-dw:
      condition: service_healthy

services:
  postgres-airflow:
    image: postgres:17.11
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER:?}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?}
      POSTGRES_DB: ${AIRFLOW_DB_NAME:?}
    volumes:
      - postgres-airflow-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${AIRFLOW_DB_USER:?}", "-d", "${AIRFLOW_DB_NAME:?}"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  postgres-dw:
    image: postgres:17.11
    environment:
      POSTGRES_USER: ${DW_USER:?}
      POSTGRES_PASSWORD: ${DW_PASSWORD:?}
      POSTGRES_DB: ${DW_DB:?}
    ports:
      - "127.0.0.1:${DW_PORT:-5433}:5432"
    volumes:
      - postgres-dw-data:/var/lib/postgresql/data
      # Executado apenas na primeira inicialização do volume.
      - ./sql/dw:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DW_USER:?}", "-d", "${DW_DB:?}"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    command: version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:?}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?}

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-airflow-data:
  postgres-dw-data:
  airflow-logs:
